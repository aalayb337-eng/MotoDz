 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطع غيار MotoDz | الدراجات النارية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; color: #333; }
        header { background-color: #111; color: #fff; padding: 15px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { background-color: #198754; color: white; padding: 12px; border: none; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .location { color: #d9534f; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <h2>MotoDz</h2>
    <p>قطع غيار الدراجات النارية</p>
</header>

<div class="container">
    <div class="card">
        <h3>قطعتك تبدأ من هنا 🏍️</h3>
        <p>تصفح المنتجات وأضف ما تحتاجه إلى السلة. تأكد من توافق القطعة مع دراجتك قبل تأكيد الطلب.</p>
        <p class="location">📍 فيض البطمة - الجلفة، الجزائر</p>
    </div>

    <input type="text" placeholder="ابحث عن قطعة أو موديل...">
    
    <select>
        <option>كل التصنيفات</option>
    </select>

    <select>
        <option>الترتيب الافتراضي</option>
    </select>

    <div style="text-align: center; font-size: 13px; color: #666; margin-bottom: 20px;">
        الأسعار والتوفر والتوافق تؤكد مع المحل قبل الدفع. لا يتم الدفع داخل الموقع.
    </div>

    <button class="btn">عرض السلة والطلب (0 دج)</button>
</div>

</body>
</html>
